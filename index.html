<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- {{tokens}} are filled from shop.config.js at build time (see vite.config.js). -->
    <title>{{shopName}} · Rate your visit</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />
    {{canonical}}

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{shopName}}" />
    <meta property="og:title" content="{{shopName}} · How was your visit?" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{shopName}} logo and rating stars" />
    {{ogUrl}}
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/logo-256.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif; text-align: center">
        <a href="{{reviewUrl}}">Write a Google review for {{shopName}}</a>
      </p>
    </noscript>
    <script type="module" src="/src/review.js"></script>
  </body>
</html>
